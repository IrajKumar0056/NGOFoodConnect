<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Provider Registration</title>
</head>

<body>
    <!-- Header -->
    <header>
        <nav>
            <div class="logo">
                <img height="80" width="130" src="Images/logo(Sevam).png" alt="logo">
            </div>
            <ul>
                <li><button><a href="1mainpage.html"><img src="Images/home_icon.svg">Home</a></button></li>
                <li class="Login_Button"><button><a href="2login.html">Login</a></button></li>
            </ul>
        </nav>
    </header>

    <!-- Main -->
    <main>
        <h1>Registering as Food Provider: </h1>
        <form>
            <div class="Provider_registration_form">
                <div>
                    <label for="Organization name">Name/Organization Name:</label>
                    <input type="text" id="Organization name" name="Organization name" placeholder="eg. Tasty Bytes">
                </div>

                <div>
                    <label for="fssai"> FSSAI Registered/License</label>
                    <input type="checkbox" id="fssai" value="yes">
                </div>

                <div>
                    <h3>Contact Details:-</h3>
                    <div>
                        <label for="Address">Address:</label>
                        <input type="text" id="Address" name="Address">
                    </div>
                    <div>
                        <label for="City">City:</label>
                        <input type="text" id="City" name="City">
                    </div>
                    <div>
                        <label for="State">State:</label>
                        <input type="text" id="State" name="State">
                    </div>
                    <div>
                        <label for="Phone Number">Phone Number:</label>
                        <input type="number" id="Phone Number" name="Phone Number">
                    </div>
                    <div>
                        <label for="Email">Email:</label>
                        <input type="text" id="Email" name="Email">
                    </div>
                </div>

                <div>
                    <h3>Create Password:-</h3>
                    <div>
                        <label for="Password">Password:</label>
                        <input type="text" id="Password" name="Password">
                    </div>
                    <div>
                        <label for="Confirm Password">Confirm Password</label>
                        <input type="password" id="Confirm Password" name="Confirm Password">
                    </div>
                </div>
            </div>

        </form>
        <div class="Register_Button">
            <button><a href="2login.html">Register</a></button>
        </div>
    </main>

    <!-- Footer -->
    <footer>
        <div class="mainpage_footer">
            <img height="80" width="130" src="Images/logo(Sevam).png" alt="logo">
            <div class="footer_contact">
                <h2>Contact-</h2>
                <ul>
                    <li>Mobile No:- 9999XXXXXX</li>
                    <li>Email:- Sevam...@gmail.com</li>
                </ul>
            </div>
        </div>
    </footer>
</body>

</html>
