<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Food WebPage</title>
</head>
<body>
    <!-- Header -->
    <header>
        <nav>
            <div class="logo">
                <img height="80" width="130" src="Images/logo(Sevam).png" alt="logo">
            </div>
            <ul>
                <li><button><a href="06FoodP_HomePage.html"><img src="Images/home_icon.svg">Home</a></button></li>
                <li class="Logout_Button"><button><a href="index.html">Logout</a></button></li>
            </ul>
        </nav>
    </header>

    <!-- Main -->
    <main>
        <form action="">
            <div class="add_food_details_form_heading">
                <h1>Add Food Details:-</h1>
            </div>
            <div class="add_food_details_form">
                <div>
                    <label for="food_name">Food Name:</label>
                    <input type="text" id="food_name" name="food_name" placeholder="eg. Biryani">
                </div>
                <div>
                    <span>Food Category:</span>
                    <input type="radio" id="Veg" name="food_category" value="Veg">
                    <label for="Veg">Veg</label>
                    <input type="radio" id="Non-Veg" name="food_category" value="Non-Veg">
                    <label for="Non-Veg">Non-Veg</label>
                </div>
                <div>
                    <label for="food_quantity">Quantity</label>
                    <input type="number" id="food_quantity" name="food_quantity">
                </div> 
                <div>
                    <span>Units:</span>
                    <input type="radio" id="Plates" name="quantity_unit" value="Plates">
                    <label for="Plates">Plates</label>
                    <input type="radio" id="Kg" name="quantity_unit" value="Kg">
                    <label for="Kg">Kg</label>
                    <input type="radio" id="Liter" name="quantity_unit" value="Liter">
                    <label for="Liter">Liter</label>
                </div>
                <div>
                    <label for="Preparation_time">Preparation Time:</label>
                    <input type="time" id="Preparation_time" name="Preparation_time">
                    <label for="Best_Before_time">Best Before:</label>
                    <input type="time" id="Best_Before_time" name="Best_Before_time">
                </div>
                <div>
                    <label for="Reasonable_Price">Reasonable Price:</label>
                    <input type="number" id="Reasonable_Price" name="Reasonable_Price">
                </div>
            </div>
        </form>

        <div class="Submit_Button">
            <button><a href="08StatusP.html">Submit</a></button>
        </div>
    </main>

    <!-- Footer -->
    <footer>
        <div class="mainpage_footer">
            <img height="80" width="130" src="Images/logo(Sevam).png" alt="logo">
            <div class="footer_contact">
                <h2>Contact-</h2>
                <ul>
                    <li>Mobile No:- 9999XXXXXX</li>
                    <li>Email:- Sevam...@gmail.com</li>
                </ul>
            </div>
        </div>
    </footer>

</body>
</html>
